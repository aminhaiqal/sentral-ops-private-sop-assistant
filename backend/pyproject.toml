[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sentral-ops-private-sop-assistant-backend"
version = "0.1.0"
description = "A minimal workspace for cited document tasks."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "openai>=1.57,<4",
    "httpx>=0.28,<1",
    "qdrant-client>=1.13,<1.21",
    "boto3>=1.36,<2",
    "pypdf>=6.1,<7",
    "python-multipart>=0.0.20,<0.1",
    "PyJWT[crypto]>=2.10.1,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.15,<0.18"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
