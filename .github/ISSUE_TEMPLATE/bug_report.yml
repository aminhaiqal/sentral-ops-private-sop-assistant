name: Bug report
description: Report a reproducible problem.
body:
  - type: markdown
    attributes:
      value: Use fictional data and redact credentials. Report security vulnerabilities privately through SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include a minimal question, fictional document, or example if relevant.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit, operating system, browser, and whether you use Docker or local development.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove credentials, private documents, and personal information.
      render: text
